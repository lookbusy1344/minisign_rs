name: "CodeQL Config"

paths-ignore:
  - rs/tests/**
  - rs/target/**
  - '**/tests.rs'
  - '**/test_*.rs'
  - '**/*_test.rs'

# Disable hardcoded credentials and crypto values for test code
query-filters:
  - exclude:
      id: rust/hardcoded-credentials
      paths:
        - rs/tests/**
        - '**/test*.rs'
  - exclude:
      id: rust/hardcoded-credentials
      tags: test
  # Blanket suppression for hard-coded-cryptographic-value
  # All current alerts are test code with hardcoded passwords/salts in #[cfg(test)] modules
  # CodeQL cannot distinguish #[cfg(test)] blocks from production code, so we disable entirely
  # Real issues will be caught in code review (project uses strict TDD and security practices)
  - exclude:
      id: rust/hard-coded-cryptographic-value
