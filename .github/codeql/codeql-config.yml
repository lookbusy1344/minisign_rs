name: "CodeQL Config"

paths-ignore:
  - rs/tests/**
  - rs/target/**
  - '**/tests.rs'
  - '**/test_*.rs'
  - '**/*_test.rs'

# Disable hardcoded credentials and crypto values for test code
query-filters:
  - exclude:
      id: rust/hardcoded-credentials
      paths:
        - rs/tests/**
        - '**/test*.rs'
  - exclude:
      id: rust/hardcoded-credentials
      tags: test
  - exclude:
      id: rust/hard-coded-cryptographic-value
      paths:
        - rs/tests/**
        - '**/test*.rs'
