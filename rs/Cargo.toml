[package]
name = "minisign-rs"
version = "1.1.0"
edition = "2024"
rust-version = "1.93"
license = "ISC"
description = "A dead simple Rust tool to sign files and verify signatures"

[dependencies]
# Cryptographic dependencies - pinned with tilde (~) for patch updates only
# This prevents unexpected changes while allowing critical security patches
ed25519-dalek = { version = "~2.2.0", features = ["rand_core"] }
blake2 = "~0.10.6"
scrypt = "~0.11.0"
zeroize = { version = "~1.8.2", features = ["derive"] }
subtle = "~2.6.1"
getrandom = "~0.3.4"
rand_core = { version = "~0.6.4", features = ["getrandom"] }

# Other dependencies
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
rpassword = "~7.4.0"
dirs = "6"
git-version = "0.3"
rayon = "1"

[dev-dependencies]
rand = "~0.8.5"
assert_cmd = "~2.0"
predicates = "~3.1"
tempfile = "~3.15"
proptest = "~1.6"
hex = "~0.4.3"
serial_test = "~3.2"

[[bin]]
name = "minisign_rs"
path = "src/main.rs"

[lib]
name = "minisign"
path = "src/lib.rs"

# Optimize scrypt even in debug builds for acceptable test performance
# Scrypt is CPU-intensive and >30x slower without optimizations
[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
strip = true
