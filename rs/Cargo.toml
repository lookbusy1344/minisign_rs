[package]
name = "minisign-rs"
version = "1.3.0"
edition = "2024"
rust-version = "1.93"
license = "ISC"
description = "A dead simple Rust tool to sign files and verify signatures"

[dependencies]
# Cryptographic dependencies
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
blake2 = "0.10"
scrypt = "0.11"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
getrandom = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }

# Other dependencies
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
rpassword = "7.4"
dirs = "6"
git-version = "0.3"
rayon = "1"

[dev-dependencies]
rand = "0.8"
assert_cmd = "2"
predicates = "3.1"
tempfile = "3.15"
proptest = "1.6"
hex = "0.4"
serial_test = "3.2"

[features]
# Enable credential store tests that require user interaction
# These tests interact with OS keyring (macOS Keychain, Windows Credential Manager, etc.)
# and must run sequentially to avoid prompting the user multiple times
credential_store_tests = []

[[bin]]
name = "minisign_rs"
path = "src/main.rs"

[lib]
name = "minisign"
path = "src/lib.rs"

# Optimize scrypt even in debug builds for acceptable test performance
# Scrypt is CPU-intensive and >30x slower without optimizations
[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
strip = true
