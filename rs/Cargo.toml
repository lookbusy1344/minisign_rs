[package]
name = "minisign-rs"
version = "0.12.0"
edition = "2024"
rust-version = "1.93"
license = "ISC"
description = "A dead simple Rust tool to sign files and verify signatures"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake2 = "0.10"
scrypt = "0.11"
rand = "0.8"  # 0.9 available but causes compatibility issues
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
dirs = "6"
getrandom = "0.3"
is-terminal = "0.4"
subtle = "2.6"
git-version = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"
hex = "0.4"
serial_test = "3"

[[bin]]
name = "minisign_rs"
path = "src/main.rs"

[lib]
name = "minisign"
path = "src/lib.rs"

# Optimize scrypt even in debug builds for acceptable test performance
# Scrypt is CPU-intensive and >30x slower without optimizations
[profile.dev.package.scrypt]
opt-level = 3
