[package]
name = "minisign-rs"
version = "1.4.0"
edition = "2024"
rust-version = "1.93"
license = "ISC"
description = "A dead simple Rust tool to sign files and verify signatures"

[dependencies]
# Cryptographic dependencies — pinned to exact versions for supply-chain auditability.
# To upgrade: verify the new release, update Cargo.lock, run cargo audit, run full test suite,
# then update the pinned version here.
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"], default-features = false }
blake2 = { version = "=0.10.6", default-features = false }
scrypt = { version = "=0.11.0", features = ["std"], default-features = false }
zeroize = { version = "=1.8.2", features = ["derive"] }
subtle = { version = "=2.6.1", default-features = false }
rand_core = "=0.6.4"
libc = { version = "0.2", default-features = false }

# Other dependencies
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
base64 = "0.22"
pico-args = { version = "0.5", features = ["eq-separator"] }
thiserror = { version = "2", default-features = false }
rpassword = "=7.4.0"
dirs = "6"
rayon = { version = "1", optional = true }

[dev-dependencies]
rand = "0.8"
assert_cmd = "2"
predicates = { version = "3.1", default-features = false }
tempfile = { version = "3.15", default-features = false }
proptest = { version = "1.6", features = ["std"], default-features = false }
hex = { version = "0.4", features = ["alloc"], default-features = false }
serial_test = { version = "3.2", default-features = false }

[features]
# Enable OS credential store integration (macOS Keychain, Windows Credential Manager, etc.)
# Enabled by default for production use. Disable during testing to avoid keychain popups.
default = ["credential_store", "parallel"]
credential_store = ["dep:keyring"]
parallel = ["dep:rayon"]

# Enable credential store tests that require user interaction
# These tests interact with OS keyring and must run sequentially to avoid prompting multiple times
credential_store_tests = ["credential_store"]

[[bin]]
name = "minisign_rs"
path = "src/main.rs"

[lib]
name = "minisign"
path = "src/lib.rs"

# Optimize scrypt even in debug builds for acceptable test performance
# Scrypt is CPU-intensive and >30x slower without optimizations
[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
strip = true
overflow-checks = true
lto = true
panic = "abort"
codegen-units = 1
opt-level = "z"

# Keep crypto hot-paths at full optimisation
[profile.release.package.scrypt]
opt-level = 3
[profile.release.package.salsa20]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.ed25519-dalek]
opt-level = 3
[profile.release.package.curve25519-dalek]
opt-level = 3
