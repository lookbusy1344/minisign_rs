[package]
name = "minisign-rs"
version = "1.2.0"
edition = "2024"
rust-version = "1.93"
license = "ISC"
description = "A dead simple Rust tool to sign files and verify signatures"

[dependencies]
# Cryptographic dependencies
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
blake2 = "0.10"
scrypt = "0.11"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
getrandom = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }

# ECIES dependencies (Phase 1)
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

# Other dependencies
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
rpassword = "7.4"
dirs = "6"
git-version = "0.3"
rayon = "1"

[dev-dependencies]
rand = "0.8"
assert_cmd = "2"
predicates = "3.1"
tempfile = "3.15"
proptest = "1.6"
hex = "0.4"
serial_test = "3.2"

[[bin]]
name = "minisign_rs"
path = "src/main.rs"

[lib]
name = "minisign"
path = "src/lib.rs"

# Optimize scrypt even in debug builds for acceptable test performance
# Scrypt is CPU-intensive and >30x slower without optimizations
[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
strip = true

# Feature flags for hardware key store backends
[features]
default = []
hw-keystore-macos = ["dep:security-framework", "dep:security-framework-sys", "dep:core-foundation"]
hw-keystore-windows = ["dep:windows"]
hw-keystore-linux = ["dep:tss-esapi"]

# Platform-conditional dependencies (Phase 2)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }
security-framework-sys = { version = "2", optional = true }
core-foundation = { version = "0.10", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "7.6", optional = true }
