[package]
name = "minisign"
version = "0.12.0"
edition = "2024"
rust-version = "1.90"
license = "ISC"
description = "A dead simple tool to sign files and verify signatures"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake2 = "0.10"
scrypt = "0.11"
rand = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
anyhow = "1"
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
dirs = "5"
getrandom = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"
hex = "0.4"

[[bin]]
name = "minisign"
path = "src/main.rs"

[lib]
name = "minisign"
path = "src/lib.rs"
